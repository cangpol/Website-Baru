version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: upitra-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-upitra_database}
      POSTGRES_USER: ${DB_USER:-upitra_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-upitra_secret_pass_2026}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - upitra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-upitra_admin} -d ${DB_NAME:-upitra_database}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Next.js Web App - UPITRA
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: upitra-next-app:latest
    container_name: upitra-web
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-upitra_admin}:${DB_PASSWORD:-upitra_secret_pass_2026}@postgres:5432/${DB_NAME:-upitra_database}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-upitra-pignatelli-triputra-surakarta-2026-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./uploads:/app/public/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - upitra-network

networks:
  upitra-network:
    driver: bridge
