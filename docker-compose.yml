version: '3.8'

services:
  # 1. PostgreSQL 16 Database (Internal Network Only)
  postgres:
    image: postgres:16-alpine
    container_name: upitra-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?Variabel DB_NAME wajib ditentukan di .env}
      POSTGRES_USER: ${DB_USER:?Variabel DB_USER wajib ditentukan di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Variabel DB_PASSWORD wajib ditentukan di .env}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      # Hanya bind ke localhost jika dibutuhkan inspeksi host, tidak dibuka ke 0.0.0.0 publik
      - "127.0.0.1:5432:5432"
    networks:
      - upitra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Next.js Web App - UPITRA
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: upitra-next-app:latest
    container_name: upitra-web
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:?Variabel DATABASE_URL wajib ditentukan di .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-${NEXTAUTH_SECRET:?Variabel ADMIN_SESSION_SECRET atau NEXTAUTH_SECRET wajib disetel}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${ADMIN_SESSION_SECRET:-upitra-default-session-secret-change-me}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - upitra-network

networks:
  upitra-network:
    driver: bridge
